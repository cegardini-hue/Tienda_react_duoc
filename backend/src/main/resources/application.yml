server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  forward-headers-strategy: framework

spring:
  application:
    name: tienda-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${DB_PATH:./data/tienda};MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:VGllbmRhUmVhY3QtZGV2ZWxvcG1lbnQta2V5LWNoYW5nZS1pbi1wcm9kdWN0aW9u}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:900}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  admin:
    email: ${ADMIN_EMAIL:}
    initial-password: ${ADMIN_INITIAL_PASSWORD:}
  seller:
    email: ${SELLER_EMAIL:}
    initial-password: ${SELLER_INITIAL_PASSWORD:}
